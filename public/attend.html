<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Meeting - GSAMS</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --danger-color: #f72585;
            --warning-color: #f8961e;
            --dark-color: #212529;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .attendance-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meeting-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .meeting-header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .meeting-info {
            background: var(--light-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .meeting-info-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .meeting-info-item:last-child {
            margin-bottom: 0;
        }

        .meeting-info-item i {
            color: var(--primary-color);
            margin-right: 10px;
            width: 20px;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.1);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: var(--transition);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .spinner-border {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .success-message {
            text-align: center;
            padding: 40px 20px;
        }

        .success-message i {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: var(--dark-color);
            margin-bottom: 15px;
        }

        .location-status {
            background: var(--light-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .location-status.active {
            display: block;
        }

        .location-status i {
            color: var(--success-color);
            margin-right: 8px;
        }

        .required-field::after {
            content: ' *';
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="attendance-container">
        <div id="loadingState">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading meeting details...</p>
            </div>
        </div>

        <div id="errorState" style="display: none;">
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="errorMessage"></span>
            </div>
            <a href="/" class="btn btn-primary">Go to Home</a>
        </div>

        <div id="formState" style="display: none;">
            <div class="meeting-header">
                <h1 id="meetingTitle">Meeting Attendance</h1>
                <p class="text-muted" id="meetingDescription"></p>
            </div>

            <div class="meeting-info">
                <div class="meeting-info-item">
                    <i class="fas fa-building"></i>
                    <span id="organizationName"></span>
                </div>
                <div class="meeting-info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="locationName"></span>
                </div>
                <div class="meeting-info-item">
                    <i class="fas fa-clock"></i>
                    <span id="meetingTime"></span>
                </div>
            </div>

            <div class="location-status" id="locationStatus">
                <i class="fas fa-check-circle"></i>
                <span>Location verified</span>
            </div>

            <form id="attendanceForm">
                <div class="mb-3">
                    <label for="fullName" class="form-label required-field">Full Name</label>
                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1234567890">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="mb-3">
                    <label for="idNumber" class="form-label">ID Number</label>
                    <input type="text" class="form-control" id="idNumber" name="idNumber">
                </div>

                <div id="customFields"></div>

                <button type="submit" class="btn btn-submit" id="submitBtn">
                    <i class="fas fa-check me-2"></i>
                    Mark Attendance
                </button>
            </form>
        </div>

        <div id="successState" style="display: none;">
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <h2>Attendance Recorded!</h2>
                <p class="text-muted">Your attendance has been successfully recorded.</p>
                <p class="mt-3"><strong id="attendeeName"></strong></p>
                <p class="text-muted">Reference: <code id="referenceCode"></code></p>
                <a href="/" class="btn btn-primary mt-3">Return to Home</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Get API base URL dynamically
        const API_BASE_URL = window.location.origin + '/api';

        let meetingData = null;
        let userLocation = null;
        let publicCode = null;

        // Get meeting code from URL
        function getMeetingCode() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('code');
        }

        // Load meeting details
        async function loadMeetingDetails() {
            publicCode = getMeetingCode();

            if (!publicCode) {
                showError('No meeting code provided');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/meetings/${publicCode}/form`);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Meeting not found');
                }

                meetingData = await response.json();
                displayMeetingForm();
                requestLocation();

            } catch (error) {
                console.error('Error loading meeting:', error);
                showError(error.message || 'Failed to load meeting details');
            }
        }

        // Display meeting form
        function displayMeetingForm() {
            document.getElementById('meetingTitle').textContent = meetingData.meeting.title;
            document.getElementById('meetingDescription').textContent = meetingData.meeting.description || '';
            document.getElementById('organizationName').textContent = meetingData.meeting.organization;
            document.getElementById('locationName').textContent = meetingData.meeting.location.name;

            // Show form
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formState').style.display = 'block';

            // Add custom fields if any
            if (meetingData.customFormFields && meetingData.customFormFields.length > 0) {
                const customFieldsContainer = document.getElementById('customFields');
                meetingData.customFormFields.forEach(field => {
                    const fieldDiv = document.createElement('div');
                    fieldDiv.className = 'mb-3';

                    const label = document.createElement('label');
                    label.className = 'form-label';
                    if (field.required) label.classList.add('required-field');
                    label.textContent = field.label;

                    let input;
                    if (field.type === 'select') {
                        input = document.createElement('select');
                        input.className = 'form-select';
                        field.options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt;
                            option.textContent = opt;
                            input.appendChild(option);
                        });
                    } else {
                        input = document.createElement('input');
                        input.type = field.type || 'text';
                        input.className = 'form-control';
                    }

                    input.id = field.name;
                    input.name = field.name;
                    input.required = field.required || false;

                    fieldDiv.appendChild(label);
                    fieldDiv.appendChild(input);
                    customFieldsContainer.appendChild(fieldDiv);
                });
            }
        }

        // Request user location
        function requestLocation() {
            if (!meetingData.allowedModes.smartphoneGPS) {
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };

                        // Verify location is within range
                        const distance = calculateDistance(
                            userLocation.latitude,
                            userLocation.longitude,
                            meetingData.meeting.location.latitude,
                            meetingData.meeting.location.longitude
                        );

                        if (distance <= meetingData.meeting.location.radius) {
                            document.getElementById('locationStatus').classList.add('active');
                        }
                    },
                    (error) => {
                        console.warn('Location access denied:', error);
                    }
                );
            }
        }

        // Calculate distance between two coordinates (in meters)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radius of Earth in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Generate unique device ID
        function generateDeviceId() {
            return 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Submit attendance
        async function submitAttendance(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

            try {
                const formData = new FormData(event.target);

                // Prepare attendee info
                const attendeeInfo = {
                    fullName: formData.get('fullName'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    idNumber: formData.get('idNumber')
                };

                // Prepare device info
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    deviceId: localStorage.getItem('deviceId') || generateDeviceId(),
                    screenResolution: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };

                // Store device ID for future use
                if (!localStorage.getItem('deviceId')) {
                    localStorage.setItem('deviceId', deviceInfo.deviceId);
                }

                const attendanceData = {
                    meetingCode: publicCode,
                    attendeeInfo: attendeeInfo,
                    locationData: userLocation ? {
                        latitude: userLocation.latitude,
                        longitude: userLocation.longitude,
                        accuracy: userLocation.accuracy,
                        timestamp: new Date().toISOString()
                    } : null,
                    deviceInfo: deviceInfo,
                    formData: {}
                };

                // Add custom fields to formData object
                if (meetingData.customFormFields) {
                    meetingData.customFormFields.forEach(field => {
                        attendanceData.formData[field.name] = formData.get(field.name);
                    });
                }

                const response = await fetch(`${API_BASE_URL}/attend/smartphone`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(attendanceData)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to submit attendance');
                }

                // Show success
                showSuccess(attendanceData.fullName, result.attendanceId);

            } catch (error) {
                console.error('Attendance submission error:', error);
                alert(error.message || 'Failed to submit attendance. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>Mark Attendance';
            }
        }

        // Show error state
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorState').style.display = 'block';
        }

        // Show success state
        function showSuccess(name, referenceCode) {
            document.getElementById('formState').style.display = 'none';
            document.getElementById('attendeeName').textContent = name;
            document.getElementById('referenceCode').textContent = referenceCode;
            document.getElementById('successState').style.display = 'block';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadMeetingDetails();
            document.getElementById('attendanceForm').addEventListener('submit', submitAttendance);
        });
    </script>
</body>
</html>
