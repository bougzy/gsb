<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription & Billing - GSAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        .container {
            max-width: 1200px;
        }

        .page-header {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .subscription-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .plan-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid transparent;
        }

        .plan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .plan-card.current {
            border-color: #6366f1;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }

        .plan-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .plan-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .plan-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #6366f1;
        }

        .plan-price small {
            font-size: 1rem;
            color: #6b7280;
        }

        .plan-features {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
        }

        .plan-features li {
            padding: 0.5rem 0;
            color: #4b5563;
        }

        .plan-features li i {
            color: #10b981;
            margin-right: 0.5rem;
        }

        .current-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 0.25rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .status-trial {
            background: #fef3c7;
            color: #92400e;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .usage-bar {
            background: #e5e7eb;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .usage-fill {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .usage-fill.warning {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        }

        .usage-fill.danger {
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
        }

        .btn-select-plan {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 10px;
        }

        .billing-cycle-toggle {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .billing-cycle-toggle label {
            padding: 0.5rem 1.5rem;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .billing-cycle-toggle input:checked + label {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-color: #6366f1;
        }

        .billing-cycle-toggle input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1><i class="fas fa-credit-card text-primary"></i> Subscription & Billing</h1>
                    <p class="text-muted mb-0">Manage your subscription plan and view usage</p>
                </div>
                <a href="dashboard.html" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>

        <!-- Current Subscription -->
        <div class="subscription-card">
            <h3 class="mb-3">Current Subscription</h3>
            <div class="row" id="currentSubscription">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Usage -->
        <div class="subscription-card" id="usageSection">
            <h3 class="mb-3">Current Usage</h3>
            <div class="row" id="usageDetails">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Billing Cycle Toggle -->
        <div class="billing-cycle-toggle">
            <div>
                <input type="radio" name="billingCycle" id="monthly" value="monthly" checked>
                <label for="monthly">Monthly</label>
            </div>
            <div>
                <input type="radio" name="billingCycle" id="annual" value="annual">
                <label for="annual">Annual <small>(Save 2 months)</small></label>
            </div>
        </div>

        <!-- Available Plans -->
        <h2 class="text-white text-center mb-4">Available Plans</h2>
        <div class="row" id="availablePlans">
            <div class="col-12 text-center">
                <div class="spinner-border text-white" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5000/api'
            : 'https://gsams.vercel.app/api';

        const authToken = localStorage.getItem('authToken');

        // Check authentication
        if (!authToken) {
            window.location.href = 'login.html';
        }

        let currentPlanId = null;
        let selectedBillingCycle = 'monthly';

        // Load current subscription
        async function loadCurrentSubscription() {
            try {
                const response = await fetch(`${API_BASE_URL}/organization/subscription`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                displayCurrentSubscription(data.subscription, data.usage);
            } catch (error) {
                console.error('Load subscription error:', error);
                document.getElementById('currentSubscription').innerHTML = '<p class="text-danger">Failed to load subscription</p>';
            }
        }

        function displayCurrentSubscription(subscription, usage) {
            const container = document.getElementById('currentSubscription');

            if (!subscription || !subscription.planId) {
                container.innerHTML = `
                    <div class="col-12">
                        <p class="text-muted">No subscription plan assigned yet. Please select a plan below.</p>
                    </div>
                `;
                return;
            }

            currentPlanId = subscription.planId._id;
            const plan = subscription.planId;
            const status = subscription.status || 'trial';
            const periodEnd = subscription.currentPeriodEnd ? new Date(subscription.currentPeriodEnd).toLocaleDateString() : 'N/A';
            const trialEnd = subscription.trialEndsAt ? new Date(subscription.trialEndsAt).toLocaleDateString() : null;

            container.innerHTML = `
                <div class="col-md-6">
                    <h4>${plan.displayName} <span class="current-badge">Current Plan</span></h4>
                    <p class="text-muted">${plan.description || ''}</p>
                    <p><strong>Price:</strong> $${(plan.pricing.monthly / 100).toFixed(0)}/month</p>
                    <p><strong>Billing Cycle:</strong> ${subscription.billingCycle || 'monthly'}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${status}">${status.toUpperCase()}</span></p>
                    ${trialEnd ? `<p><strong>Trial Ends:</strong> ${trialEnd}</p>` : ''}
                    ${!trialEnd ? `<p><strong>Next Billing Date:</strong> ${periodEnd}</p>` : ''}
                </div>
                <div class="col-md-6">
                    <h5>Plan Limits</h5>
                    <ul>
                        <li>${plan.limits.maxAttendees} attendees/month</li>
                        <li>${plan.limits.maxAdmins} admins</li>
                        <li>${plan.limits.maxMeetings} meetings/month</li>
                        <li>${plan.limits.maxStorageGB}GB storage</li>
                    </ul>
                </div>
            `;

            // Display usage
            if (usage) {
                displayUsage(usage, plan.limits);
            }
        }

        function displayUsage(usage, limits) {
            const container = document.getElementById('usageDetails');

            const attendeePercent = (usage.currentMonthAttendees / limits.maxAttendees) * 100;
            const meetingPercent = (usage.currentMonthMeetings / limits.maxMeetings) * 100;
            const storagePercent = (usage.storageUsedMB / (limits.maxStorageGB * 1024)) * 100;

            function getBarClass(percent) {
                if (percent >= 90) return 'danger';
                if (percent >= 70) return 'warning';
                return '';
            }

            container.innerHTML = `
                <div class="col-md-4">
                    <h6>Attendees This Month</h6>
                    <p>${usage.currentMonthAttendees || 0} / ${limits.maxAttendees}</p>
                    <div class="usage-bar">
                        <div class="usage-fill ${getBarClass(attendeePercent)}" style="width: ${Math.min(attendeePercent, 100)}%"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <h6>Meetings This Month</h6>
                    <p>${usage.currentMonthMeetings || 0} / ${limits.maxMeetings}</p>
                    <div class="usage-bar">
                        <div class="usage-fill ${getBarClass(meetingPercent)}" style="width: ${Math.min(meetingPercent, 100)}%"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <h6>Storage Used</h6>
                    <p>${(usage.storageUsedMB / 1024).toFixed(2)} GB / ${limits.maxStorageGB} GB</p>
                    <div class="usage-bar">
                        <div class="usage-fill ${getBarClass(storagePercent)}" style="width: ${Math.min(storagePercent, 100)}%"></div>
                    </div>
                </div>
            `;
        }

        // Load available plans
        async function loadPlans() {
            try {
                const response = await fetch(`${API_BASE_URL}/organization/plans`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                displayPlans(data.plans);
            } catch (error) {
                console.error('Load plans error:', error);
                document.getElementById('availablePlans').innerHTML = '<p class="text-white">Failed to load plans</p>';
            }
        }

        function displayPlans(plans) {
            const container = document.getElementById('availablePlans');

            container.innerHTML = plans.map(plan => {
                const isCurrent = plan._id === currentPlanId;
                const price = selectedBillingCycle === 'annual'
                    ? (plan.pricing.annual / 100).toFixed(0)
                    : (plan.pricing.monthly / 100).toFixed(0);

                return `
                    <div class="col-md-4">
                        <div class="plan-card ${isCurrent ? 'current' : ''}">
                            <div class="plan-header">
                                <div class="plan-name">
                                    ${plan.displayName}
                                    ${isCurrent ? '<span class="current-badge">Current</span>' : ''}
                                </div>
                                <div class="plan-price">
                                    $${price}<small>/${selectedBillingCycle === 'annual' ? 'year' : 'month'}</small>
                                </div>
                            </div>

                            <p class="text-muted text-center">${plan.description || ''}</p>

                            <ul class="plan-features">
                                <li><i class="fas fa-users"></i> ${plan.limits.maxAttendees} attendees/month</li>
                                <li><i class="fas fa-user-shield"></i> ${plan.limits.maxAdmins} admins</li>
                                <li><i class="fas fa-calendar"></i> ${plan.limits.maxMeetings} meetings/month</li>
                                <li><i class="fas fa-database"></i> ${plan.limits.maxStorageGB}GB storage</li>
                                ${plan.features.gpsVerification ? '<li><i class="fas fa-check"></i> GPS Verification</li>' : ''}
                                ${plan.features.smsVerification ? '<li><i class="fas fa-check"></i> SMS Verification</li>' : ''}
                                ${plan.features.advancedAnalytics ? '<li><i class="fas fa-check"></i> Advanced Analytics</li>' : ''}
                                ${plan.features.apiAccess ? '<li><i class="fas fa-check"></i> API Access</li>' : ''}
                            </ul>

                            <button class="btn btn-select-plan ${isCurrent ? 'btn-secondary' : 'btn-primary'}"
                                    onclick="selectPlan('${plan._id}')"
                                    ${isCurrent ? 'disabled' : ''}>
                                ${isCurrent ? 'Current Plan' : 'Select Plan'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Select plan
        async function selectPlan(planId) {
            if (!confirm('Are you sure you want to change your subscription plan?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/organization/subscription/select-plan`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        planId,
                        billingCycle: selectedBillingCycle
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to select plan');
                }

                alert('Subscription plan updated successfully!');
                location.reload();
            } catch (error) {
                alert(error.message);
            }
        }

        // Event listeners
        document.querySelectorAll('input[name="billingCycle"]').forEach(input => {
            input.addEventListener('change', function() {
                selectedBillingCycle = this.value;
                loadPlans();
            });
        });

        // Load data on page load
        loadCurrentSubscription();
        loadPlans();
    </script>
</body>
</html>
